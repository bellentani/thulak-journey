<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A Descoberta de Thulak</title>
    <meta
      name="description"
      content="A Descoberta de Thulak: fantasia sombria em estilo terminal, agora tambem no browser."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <main class="shell">
      <header class="shell__header">
        <div class="title-bar">
          <div id="titleBarLabel" class="title-bar__label">A DESCOBERTA DE THULAK :: DOS RUNTIME</div>
        </div>
        <nav id="menuBar" class="menu-bar" aria-label="Primary commands"></nav>
      </header>

      <section class="shell__body">
        <aside class="visual-panel">
          <pre id="visualFrame" class="ascii-frame" aria-hidden="true"></pre>
        </aside>

        <section class="content-panel">
          <h2 id="screenTitle" class="panel-title" tabindex="-1"></h2>
          <div id="screenBody" class="panel-body"></div>
          <div id="choices" class="choices"></div>
          <div id="metaNote" class="meta-note"></div>
        </section>
      </section>

      <section class="shell__status" id="statusBar"></section>

      <footer class="shell__footer">
        <span id="footerCopy">Terminal Fantasy Engine v0.1</span>
        <span class="footer-signature">A project by Poe Bellentani</span>
      </footer>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
